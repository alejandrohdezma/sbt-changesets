name: sbt-changesets
description: Changeset-based versioning for Scala multi-module builds. Detect affected modules, publish snapshots, and release.

branding:
  icon: package
  color: red

inputs:
  mode:
    description: "'detect' to validate changesets and output affected modules and pending changeset count, 'snapshot' for PR snapshots, 'apply-changesets' to bump versions and upsert the 'Version Packages' PR, 'prepare-release' to compute the per-module publish matrix"
    required: true
  pr-number:
    description: "PR number for snapshot comment (defaults to github.event.pull_request.number)"
    required: false
    default: ${{ github.event.pull_request.number }}
  github-token:
    description: "GitHub token for API operations (defaults to github.token)"
    required: false
    default: ${{ github.token }}
  error-help-url:
    description: "URL to display on changeset validation failure (e.g. link to versioning docs)"
    required: false
    default: ""
  skip-validation:
    description: "Skip changeset validation in detect mode while still computing affected modules (default: false)"
    required: false
    default: "false"
  extra-command:
    description: "Optional sbt command(s) to chain after `changesetVersion` in 'apply-changesets' mode. Useful for regenerating doc files (e.g. `documentation/mdoc`) so they get committed as part of the version PR. Use `;` to chain multiple commands."
    required: false
    default: ""

outputs:
  affected:
    description: "JSON array of affected module names (only set when mode is 'detect')"
    value: ${{ steps.detect.outputs.affected }}
  changesets-count:
    description: "Number of pending .changeset/*.md files (only set when mode is 'detect')"
    value: ${{ steps.detect.outputs.changesets-count }}
  matrix:
    description: "JSON string array of module names for matrix publishing (only set when mode is 'prepare-release')"
    value: ${{ steps.matrix.outputs.matrix }}

runs:
  using: composite
  steps:
    # ─── Detect mode ─────────────────────────────
    # Validates that every changed module has a corresponding .changeset/*.md entry,
    # then emits the affected modules (changed + transitive dependents) as JSON and
    # the count of pending changeset files.
    # Run on pull requests to gate the test matrix and on push to main to dispatch
    # between the `apply-changesets` and `prepare-release` modes.

    - name: Detect affected modules
      if: inputs.mode == 'detect'
      id: detect
      shell: bash
      env:
        CHANGESET_SKIP_VALIDATION: ${{ inputs.skip-validation }}
      run: |
        sbt changesetAffected || {
          if [ -n "${{ inputs.error-help-url }}" ]; then
            echo "See: ${{ inputs.error-help-url }}"
          fi
          exit 1
        }
        echo "affected=$(jq -c . target/changeset/affected.json)" >> "$GITHUB_OUTPUT"

        COUNT=$(find .changeset -name "*.md" ! -name "README.md" 2>/dev/null | wc -l | tr -d ' ')
        echo "changesets-count=$COUNT" >> "$GITHUB_OUTPUT"

    # ─── Snapshot mode ───────────────────────────
    # Publishes timestamped SNAPSHOT artifacts for affected modules and upserts a
    # PR comment with the Maven coordinates so reviewers can try the changes.
    # Run on pull requests after tests pass; intended for private monorepos only
    # (publishing credentials would otherwise leak on public PRs).

    - name: Publish snapshots
      if: inputs.mode == 'snapshot'
      shell: bash
      run: sbt publishSnapshot

    - name: Comment snapshot coordinates on PR
      if: inputs.mode == 'snapshot'
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
      run: |
        COORDINATES_FILE="target/changeset/snapshot-coordinates.json"

        if [ ! -f "$COORDINATES_FILE" ]; then
          echo "No snapshot coordinates file found. Skipping comment."
          exit 0
        fi

        BLOCKS=$(jq -r '.[] | "```scala\n\(.coordinate)\n```"' "$COORDINATES_FILE")
        BODY_FILE=$(mktemp)

        cat > "$BODY_FILE" <<EOF
        ### Snapshot releases

        Install with:

        ${BLOCKS}

        _Updated on each push to this PR._
        EOF

        # Try to update the last bot comment, fall back to creating a new one
        gh pr comment "${{ inputs.pr-number }}" --edit-last --body-file "$BODY_FILE" 2>/dev/null \
          || gh pr comment "${{ inputs.pr-number }}" --body-file "$BODY_FILE"

        rm -f "$BODY_FILE"

    # ─── Apply-changesets ────────────────────────
    # Bumps VERSION files (via `changesetVersion`) and upserts the
    # "Version Packages" pull request on the `changeset-release/main` branch.
    # Run after a developer's PR carrying changeset files is merged to main.

    - name: Apply changesets
      if: inputs.mode == 'apply-changesets'
      id: apply-changesets
      shell: bash
      env:
        RELEASE: "true"
        EXTRA_COMMAND: ${{ inputs.extra-command }}
      run: |
        if [ -n "$EXTRA_COMMAND" ]; then
          sbt "changesetVersion; $EXTRA_COMMAND"
        else
          sbt changesetVersion
        fi

        echo "body<<EOF" >> "$GITHUB_OUTPUT"
        jq -r '"## Version Packages\n\n" + ([.[] | "- **\(.module)**: \(.old_version) → \(.new_version)"] | join("\n"))' \
          target/changeset/version-summary.json >> "$GITHUB_OUTPUT"
        echo "EOF" >> "$GITHUB_OUTPUT"

    - name: Create version PR
      if: inputs.mode == 'apply-changesets'
      uses: alejandrohdezma/actions/upsert-pr@v1
      with:
        branch: changeset-release/main
        title: "Changesets: Version Packages"
        message: "Version Packages [skip ci]"
        body: ${{ steps.apply-changesets.outputs.body }}
        github-token: ${{ inputs.github-token }}

    # ─── Prepare-release ─────────────────────────
    # Emits a JSON array of module names whose VERSION changed in the last
    # commit, suitable for a downstream matrix publish job.
    # Run after the "Version Packages" PR is merged to main.

    - name: Compute publish matrix
      if: inputs.mode == 'prepare-release'
      id: matrix
      shell: bash
      run: |
        sbt changesetMatrix
        echo "matrix=$(jq -c . target/changeset/matrix.json)" >> "$GITHUB_OUTPUT"
