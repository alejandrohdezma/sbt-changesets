name: sbt-changesets
description: Changeset-based versioning for Scala multi-module builds. Detect affected modules, apply changesets, and prepare releases.

branding:
  icon: package
  color: red

inputs:
  mode:
    description: "'detect' to validate changesets and emit the test/publish matrices, snapshot coordinates, and pending changeset count, 'apply-changesets' to bump versions and upsert the 'Version Packages' PR, 'snapshot-comment' to post a PR comment listing snapshot coordinates, 'release-tag' to create one GitHub release per row in `release-modules`"
    required: true
  github-token:
    description: "GitHub token for API operations (defaults to github.token)"
    required: false
    default: ${{ github.token }}
  error-help-url:
    description: "URL to display on changeset validation failure (e.g. link to versioning docs)"
    required: false
    default: ""
  skip-validation:
    description: "Skip changeset validation in detect mode while still computing affected modules (default: false)"
    required: false
    default: "false"
  extra-command:
    description: "Optional sbt command(s) to chain after `changesetVersion` in 'apply-changesets' mode. Useful for regenerating doc files (e.g. `documentation/mdoc`) so they get committed as part of the version PR. Use `;` to chain multiple commands."
    required: false
    default: ""
  coordinates:
    description: "JSON array of snapshot coordinates as produced by `extractSnapshotCoordinates` (only used in 'snapshot-comment' mode). Each element should be `{module, version, coordinate}`."
    required: false
    default: ""
  pr-number:
    description: "PR number to comment on in 'snapshot-comment' mode (defaults to github.event.pull_request.number)"
    required: false
    default: ${{ github.event.pull_request.number }}
  release-modules:
    description: "JSON array of `{module, version, changelog}` rows as produced by the `detect` mode's `release-modules` output (only used in 'release-tag' mode)"
    required: false
    default: ""
  target:
    description: "Branch (or commit SHA) to target for the created GitHub releases (only used in 'release-tag' mode)"
    required: false
    default: main

outputs:
  affected:
    description: "JSON array of `{module, scala-version}` objects — one row per affected module / Scala version pair. Consume directly as a GitHub Actions `matrix.include`. (only set when mode is 'detect')"
    value: ${{ steps.detect.outputs.affected }}
  affected-modules:
    description: "JSON array of distinct affected module names, derived from the `affected` matrix. Useful for empty-set gating, snapshot coordinate resolution, or any per-module (rather than per-Scala-version) step. (only set when mode is 'detect')"
    value: ${{ steps.detect.outputs.affected-modules }}
  changesets-count:
    description: "Number of pending .changeset/*.md files (only set when mode is 'detect')"
    value: ${{ steps.detect.outputs.changesets-count }}
  coordinates:
    description: "JSON array of resolved snapshot coordinates for the affected modules (only set when mode is 'detect'; uses SNAPSHOT_SUFFIX env var if set)"
    value: ${{ steps.detect.outputs.coordinates }}
  matrix:
    description: "JSON array of `{module, scala-version}` rows to publish — one row per (module, Scala version) pair whose VERSION changed in the last commit. Consume directly as a GitHub Actions `matrix.include`. (only set when mode is 'detect')"
    value: ${{ steps.detect.outputs.matrix }}
  release-modules:
    description: "JSON array of `{module, changelog}` rows — one per distinct module being released. The `changelog` field is the matching `## <version>` body from the module's CHANGELOG.md. Feed into the release-tag job so it can create GitHub releases without booting sbt. (only set when mode is 'detect')"
    value: ${{ steps.detect.outputs.release-modules }}

runs:
  using: composite
  steps:
    # ─── Detect mode ─────────────────────────────
    # Validates that every changed module has a corresponding .changeset/*.md entry,
    # then emits:
    #   - `affected`: JSON array of `{module, scala-version}` rows (changed + transitive
    #     dependents, expanded over each module's `crossScalaVersions`) — consume as
    #     `matrix.include` in the PR validate / snapshot job.
    #   - `affected-modules`: distinct module names derived from `affected`. Useful for
    #     empty-set gating and per-module steps.
    #   - `matrix`: JSON array of `{module, scala-version}` rows whose VERSION changed
    #     in the last commit — consume as `matrix.include` in the publish job that runs
    #     after a Version Packages PR merge.
    #   - `release-modules`: JSON array of `{module, changelog}` rows for the
    #     distinct modules being released. Lets the release-tag job create GitHub
    #     releases without booting sbt. Hard-fails if the serialised payload exceeds
    #     400 KB UTF-8 (~800 KB UTF-16), well under GitHub's 1 MB per-job output cap.
    #   - `changesets-count`: number of pending `.changeset/*.md` files. Use to
    #     dispatch between `apply-changesets` (count != 0) and the release pipeline
    #     (count == 0) on push-to-main.
    #   - `coordinates`: resolved snapshot coordinates per affected module (uses the
    #     SNAPSHOT_SUFFIX env var when set; otherwise a memoised JVM timestamp). Used
    #     by `snapshot-comment` mode.
    # Run on every event; the consumer routes outputs into validate / snapshot-comment
    # (PR) and apply-changesets / publish / release-tag (push to main).

    - name: Detect affected modules
      if: inputs.mode == 'detect'
      id: detect
      shell: bash
      env:
        CHANGESET_SKIP_VALIDATION: ${{ inputs.skip-validation }}
      run: |
        sbt "changesetAffected; changesetMatrix" || {
          if [ -n "${{ inputs.error-help-url }}" ]; then
            echo "See: ${{ inputs.error-help-url }}"
          fi
          exit 1
        }
        AFFECTED=$(jq -c . target/changeset/affected.json)
        echo "affected=$AFFECTED" >> "$GITHUB_OUTPUT"

        AFFECTED_MODULES=$(echo "$AFFECTED" | jq -c '[.[].module] | unique')
        echo "affected-modules=$AFFECTED_MODULES" >> "$GITHUB_OUTPUT"

        MATRIX=$(jq -c . target/changeset/matrix.json)
        echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"

        RELEASE_MODULE_NAMES=$(echo "$MATRIX" | jq -r '[.[].module] | unique | .[]' | tr '\n' ' ')

        SBT_PHASE_2=""
        if [ "$AFFECTED_MODULES" != "[]" ]; then
          MODULES=$(echo "$AFFECTED_MODULES" | jq -r '.[]' | tr '\n' ' ')
          SBT_PHASE_2="extractSnapshotCoordinates $MODULES"
        fi
        if [ -n "$RELEASE_MODULE_NAMES" ]; then
          SBT_PHASE_2="${SBT_PHASE_2:+$SBT_PHASE_2; }extractChangelogs $RELEASE_MODULE_NAMES"
        fi
        if [ -n "$SBT_PHASE_2" ]; then
          sbt "$SBT_PHASE_2"
        fi

        if [ "$AFFECTED_MODULES" != "[]" ]; then
          echo "coordinates=$(jq -c . target/changeset/snapshot-coordinates.json)" >> "$GITHUB_OUTPUT"
        fi
        if [ -n "$RELEASE_MODULE_NAMES" ]; then
          BYTES=$(wc -c < target/changeset/release-modules.json | tr -d ' ')
          if [ "$BYTES" -gt 400000 ]; then
            echo "::error::release-modules payload is $BYTES bytes (UTF-8); GitHub Actions job outputs are capped at 1 MB UTF-16 (~500 KB UTF-8). Reduce changelog verbosity or split the release."
            exit 1
          fi
          echo "release-modules=$(jq -c . target/changeset/release-modules.json)" >> "$GITHUB_OUTPUT"
        else
          echo "release-modules=[]" >> "$GITHUB_OUTPUT"
        fi

        COUNT=$(find .changeset -name "*.md" ! -name "README.md" 2>/dev/null | wc -l | tr -d ' ')
        echo "changesets-count=$COUNT" >> "$GITHUB_OUTPUT"

    # ─── Apply-changesets ────────────────────────
    # Bumps VERSION files (via `changesetVersion`) and upserts the
    # "Version Packages" pull request on the `changeset-release/main` branch.
    # Run after a developer's PR carrying changeset files is merged to main.

    - name: Apply changesets
      if: inputs.mode == 'apply-changesets'
      id: apply-changesets
      shell: bash
      env:
        RELEASE: "true"
        EXTRA_COMMAND: ${{ inputs.extra-command }}
      run: |
        if [ -n "$EXTRA_COMMAND" ]; then
          sbt "changesetVersion; $EXTRA_COMMAND"
        else
          sbt changesetVersion
        fi

        echo "body<<EOF" >> "$GITHUB_OUTPUT"
        jq -r '"## Version Packages\n\n" + ([.[] | "- **\(.module)**: \(.old_version) → \(.new_version)"] | join("\n"))' \
          target/changeset/version-summary.json >> "$GITHUB_OUTPUT"
        echo "EOF" >> "$GITHUB_OUTPUT"

    - name: Create version PR
      if: inputs.mode == 'apply-changesets'
      uses: alejandrohdezma/actions/upsert-pr@v1
      with:
        branch: changeset-release/main
        title: "Changesets: Version Packages"
        message: "Version Packages [skip ci]"
        body: ${{ steps.apply-changesets.outputs.body }}
        github-token: ${{ inputs.github-token }}

    # ─── Snapshot-comment ────────────────────────
    # Posts (or edits) a PR comment listing snapshot coordinates produced by a matrix
    # snapshot publish. The `coordinates` input is the JSON output of
    # `extractSnapshotCoordinates`; typically computed once in the same job that runs
    # the action's `detect` mode and surfaced via `needs.<detect-job>.outputs.coordinates`.

    - name: Post snapshot coordinates comment
      if: inputs.mode == 'snapshot-comment'
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        GH_REPO: ${{ github.repository }}
        PR_NUMBER: ${{ inputs.pr-number }}
        COORDINATES: ${{ inputs.coordinates }}
      run: |
        BLOCKS=$(echo "$COORDINATES" | jq -r '.[] | "```scala\n\(.coordinate)\n```"')
        BODY_FILE=$(mktemp)
        cat > "$BODY_FILE" <<EOF
        ### Snapshot releases

        Install with:
        ${BLOCKS}

        _Updated on each push to this PR._
        EOF
        gh pr comment "$PR_NUMBER" --edit-last --body-file "$BODY_FILE" 2>/dev/null \
          || gh pr comment "$PR_NUMBER" --body-file "$BODY_FILE"
        rm -f "$BODY_FILE"

    # ─── Release-tag ─────────────────────────────
    # Loops over `release-modules` (as produced by `detect`) and creates one GitHub
    # release per row via `gh release create`. Each row carries `module`, `version`,
    # and `changelog`, so this mode does not need sbt or a working tree — pure API.
    # Skips tags that already exist, making reruns idempotent.
    # Run after the publish job(s) succeed on push-to-main when changesets-count == 0.

    - name: Create GitHub releases
      if: inputs.mode == 'release-tag'
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        GH_REPO: ${{ github.repository }}
        RELEASES: ${{ inputs.release-modules }}
        TARGET: ${{ inputs.target }}
      run: |
        for ENTRY in $(jq -c '.[]' <<< "$RELEASES"); do
          MODULE=$(jq -r .module <<< "$ENTRY")
          VERSION=$(jq -r .version <<< "$ENTRY")
          TAG="$MODULE@$VERSION"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; skipping."
            continue
          fi
          BODY_FILE=$(mktemp)
          jq -r .changelog <<< "$ENTRY" > "$BODY_FILE"
          gh release create "$TAG" \
            --title "$TAG" \
            --notes-file "$BODY_FILE" \
            --target "$TARGET"
          rm -f "$BODY_FILE"
          echo "Created release: $TAG"
        done
