name: sbt-changesets
description: Changeset-based versioning for Scala multi-module builds. Detect affected modules, apply changesets, and prepare releases.

branding:
  icon: package
  color: red

inputs:
  mode:
    description: "'detect' to validate changesets and emit the test/publish matrices, snapshot coordinates, and pending changeset count, 'apply-changesets' to bump versions and upsert the 'Version Packages' PR, 'snapshot-comment' to post a PR comment listing snapshot coordinates, 'release-tag' to create one GitHub release per row in `release-modules`"
    required: true
  github-token:
    description: "GitHub token for API operations (defaults to github.token)"
    required: false
    default: ${{ github.token }}
  error-help-url:
    description: "URL to display on changeset validation failure (e.g. link to versioning docs)"
    required: false
    default: ""
  skip-validation:
    description: "Skip changeset validation in detect mode while still computing affected modules (default: false)"
    required: false
    default: "false"
  extra-command:
    description: "Optional sbt command(s) to chain after `changesetVersion` in 'apply-changesets' mode. Useful for regenerating doc files (e.g. `mdoc`) so they get committed as part of the version PR. Use `;` to chain multiple commands."
    required: false
    default: ""
  matrix:
    description: "JSON array of rows as produced by the `detect` mode's `matrix` output. Used by `snapshot-comment` (validate-stage rows with `coordinate`) and `release-tag` (release-stage rows with `version` and `changelog`)."
    required: false
    default: ""
  pr-number:
    description: "PR number to comment on in 'snapshot-comment' mode (defaults to github.event.pull_request.number)"
    required: false
    default: ${{ github.event.pull_request.number }}
  target:
    description: "Branch (or commit SHA) to target for the created GitHub releases (only used in 'release-tag' mode)"
    required: false
    default: main

outputs:
  matrix:
    description: "The work matrix for this run, shape depending on `stage`. When `stage == 'validate'`, an array of `{module, scala-version, version, coordinate}` rows (publish-matrix dimensions + snapshot Maven coordinate for `snapshot-comment`). When `stage == 'release'`, an array of `{module, scala-version, version, changelog}` rows (publish-matrix dimensions + release-tag note body). Empty array otherwise. Pass to `snapshot-comment` / `release-tag` modes' `matrix` input; consume as `matrix.include` for the validate/publish jobs. (only set when mode is 'detect')"
    value: ${{ steps.detect.outputs.matrix }}
  stage:
    description: "The workflow stage classification for this run: `validate` (PR with affected modules), `apply-changesets` (push-to-main with pending changeset files), `release` (push-to-main with VERSION bumps to publish). Empty string for events with no downstream work. Use as the single gating condition for downstream jobs. (only set when mode is 'detect')"
    value: ${{ steps.detect.outputs.stage }}

runs:
  using: composite
  steps:
    # ─── Detect mode ─────────────────────────────
    # Validates that every changed module has a corresponding .changeset/*.md entry,
    # then emits two outputs:
    #   - `stage`: single dispatch classification — `validate` (PR with affected
    #     modules), `apply-changesets` (push with pending changesets), `release`
    #     (push with VERSION bumps), or empty (nothing to do). Consumers gate every
    #     downstream job on this single value.
    #   - `matrix`: the work matrix for this run. Shape depends on `stage`:
    #       - `validate`: `[{module, scala-version, version, coordinate}, ...]` —
    #         publish-matrix dimensions plus snapshot Maven coordinate for
    #         `snapshot-comment`.
    #       - `release`:  `[{module, scala-version, version, changelog}, ...]` —
    #         publish-matrix dimensions plus release-tag note body.
    #       - otherwise: `[]`.
    #     Hard-fails the action when the release-stage payload exceeds 400 KB.
    # Run on every event; the consumer routes the single matrix into the right
    # downstream jobs by gating on `stage`.

    - name: Detect affected modules
      if: inputs.mode == 'detect'
      id: detect
      shell: bash
      env:
        CHANGESET_SKIP_VALIDATION: ${{ inputs.skip-validation }}
      run: |
        sbt "changesetAffected; changesetMatrix" || {
          if [ -n "${{ inputs.error-help-url }}" ]; then
            echo "See: ${{ inputs.error-help-url }}"
          fi
          exit 1
        }
        AFFECTED=$(jq -c . target/changeset/affected.json)
        MATRIX_PAIRS=$(jq -c . target/changeset/matrix.json)
        AFFECTED_MODULES=$(echo "$AFFECTED" | jq -c '[.[].module] | unique')
        RELEASE_MODULE_NAMES=$(echo "$MATRIX_PAIRS" | jq -r '[.[].module] | unique | .[]' | tr '\n' ' ')
        COUNT=$(find .changeset -name "*.md" ! -name "README.md" 2>/dev/null | wc -l | tr -d ' ')

        if [ "$GITHUB_EVENT_NAME" = "pull_request" ] && [ "$AFFECTED" != "[]" ]; then
          STAGE="validate"
        elif [ "$GITHUB_EVENT_NAME" = "push" ] && [ "$COUNT" != "0" ]; then
          STAGE="apply-changesets"
        elif [ "$GITHUB_EVENT_NAME" = "push" ] && [ "$MATRIX_PAIRS" != "[]" ]; then
          STAGE="release"
        else
          STAGE=""
        fi
        echo "stage=$STAGE" >> "$GITHUB_OUTPUT"

        case "$STAGE" in
          validate)
            MODULES=$(echo "$AFFECTED_MODULES" | jq -r '.[]' | tr '\n' ' ')
            sbt "extractSnapshotCoordinates $MODULES"
            MATRIX=$(jq -c --slurpfile coords target/changeset/snapshot-coordinates.json \
              '($coords[0] | INDEX(.module)) as $idx | map(. + $idx[.module])' \
              target/changeset/affected.json)
            ;;
          release)
            sbt "extractChangelogs $RELEASE_MODULE_NAMES"
            MATRIX=$(jq -c --slurpfile rm target/changeset/release-modules.json \
              '($rm[0] | INDEX(.module)) as $idx | map(. + $idx[.module])' \
              target/changeset/matrix.json)
            BYTES=$(printf '%s' "$MATRIX" | wc -c | tr -d ' ')
            if [ "$BYTES" -gt 400000 ]; then
              echo "::error::matrix payload is $BYTES bytes (UTF-8); GitHub Actions job outputs are capped at 1 MB UTF-16 (~500 KB UTF-8). Reduce changelog verbosity or split the release."
              exit 1
            fi
            ;;
          *)
            MATRIX="[]"
            ;;
        esac
        echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"

    # ─── Apply-changesets ────────────────────────
    # Bumps VERSION files (via `changesetVersion`) and upserts the
    # "Version Packages" pull request on the `changeset-release/main` branch.
    # Run after a developer's PR carrying changeset files is merged to main.

    - name: Apply changesets
      if: inputs.mode == 'apply-changesets'
      id: apply-changesets
      shell: bash
      env:
        RELEASE: "true"
        EXTRA_COMMAND: ${{ inputs.extra-command }}
      run: |
        if [ -n "$EXTRA_COMMAND" ]; then
          sbt "changesetVersion; $EXTRA_COMMAND"
        else
          sbt changesetVersion
        fi

        echo "body<<EOF" >> "$GITHUB_OUTPUT"
        jq -r '"## Version Packages\n\n" + ([.[] | "- **\(.module)**: \(.old_version) → \(.new_version)"] | join("\n"))' \
          target/changeset/version-summary.json >> "$GITHUB_OUTPUT"
        echo "EOF" >> "$GITHUB_OUTPUT"

    - name: Create version PR
      if: inputs.mode == 'apply-changesets'
      uses: alejandrohdezma/actions/upsert-pr@v1
      with:
        branch: changeset-release/main
        title: "Changesets: Version Packages"
        message: "Version Packages [skip ci]"
        body: ${{ steps.apply-changesets.outputs.body }}
        github-token: ${{ inputs.github-token }}

    # ─── Snapshot-comment ────────────────────────
    # Posts (or edits) a PR comment listing snapshot coordinates produced by a matrix
    # snapshot publish. Consumes the validate-stage `matrix` from `detect` — rows
    # carry `module`, `scala-version`, `version`, and `coordinate`; this step
    # dedupes by module so each release is listed once.

    - name: Post snapshot coordinates comment
      if: inputs.mode == 'snapshot-comment'
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        GH_REPO: ${{ github.repository }}
        PR_NUMBER: ${{ inputs.pr-number }}
        MATRIX: ${{ inputs.matrix }}
      run: |
        BLOCKS=$(echo "$MATRIX" | jq -r 'group_by(.module) | map(.[0]) | .[] | "```scala\n\(.coordinate)\n```"')
        BODY_FILE=$(mktemp)
        cat > "$BODY_FILE" <<EOF
        ### Snapshot releases

        Install with:
        ${BLOCKS}

        _Updated on each push to this PR._
        EOF
        gh pr comment "$PR_NUMBER" --edit-last --body-file "$BODY_FILE" 2>/dev/null \
          || gh pr comment "$PR_NUMBER" --body-file "$BODY_FILE"
        rm -f "$BODY_FILE"

    # ─── Release-tag ─────────────────────────────
    # Loops over the release-stage `matrix` (as produced by `detect`) and creates one
    # GitHub release per distinct module via `gh release create`. Rows carry `module`,
    # `scala-version`, `version`, and `changelog`; duplicate module rows (from cross-
    # built modules) become no-ops on the second `gh release view`. Run after the
    # publish job(s) succeed.

    - name: Create GitHub releases
      if: inputs.mode == 'release-tag'
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        GH_REPO: ${{ github.repository }}
        MATRIX: ${{ inputs.matrix }}
        TARGET: ${{ inputs.target }}
      run: |
        for ENTRY in $(jq -c '.[]' <<< "$MATRIX"); do
          MODULE=$(jq -r .module <<< "$ENTRY")
          VERSION=$(jq -r .version <<< "$ENTRY")
          TAG="$MODULE@$VERSION"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; skipping."
            continue
          fi
          BODY_FILE=$(mktemp)
          jq -r .changelog <<< "$ENTRY" > "$BODY_FILE"
          gh release create "$TAG" \
            --title "$TAG" \
            --notes-file "$BODY_FILE" \
            --target "$TARGET"
          rm -f "$BODY_FILE"
          echo "Created release: $TAG"
        done
